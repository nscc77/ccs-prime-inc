name: Deploy Terraform

on:
  push:
    branches:
      - feature/**
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform-deploy:
    runs-on: ubuntu-22.04
    environment: dev  
    steps:
      # 1. Clone the repository
      - name: Clone Repo
        uses: actions/checkout@v3
      
      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.IAM_ROLE }}
          role-session-name: "${{ github.actor }}-${{ github.run_id }}"

      # 3. Set Terraform Environment Variables
      - name: Set Environment Variables
        run: |
          echo "TF_VAR_AWS_ACCT_ID=${{ secrets.ACCT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV

      # 4. Terraform Init, Validate, Plan, and Apply
      - name: Terraform Init, Validate, Plan, and Apply
        working-directory: ./terraform/root-module
        run: |
          terraform init
          terraform validate
          terraform plan -input=false -no-color | tee tfplan.txt

      # 5. Output the plan to a file
      - name: Comment Plan on PR
              if: github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                path: ./terraform/root-module/tfplan.txt